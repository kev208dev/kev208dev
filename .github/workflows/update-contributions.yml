name: Update contribution heatmap

on:
  workflow_dispatch:
  schedule:
    - cron: "15 15 * * *" # 00:15 KST
  push:
    branches: [main]
    paths:
      - "scripts/update_contributions.py"
      - ".github/workflows/update-contributions.yml"

permissions:
  contents: write

concurrency:
  group: contribution-heatmap
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate latest heatmap
        run: python scripts/update_contributions.py

      - name: Commit changes
        run: |
          if git diff --quiet -- contrib-heatmap.svg; then
            echo "Contribution heatmap is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contrib-heatmap.svg
          git commit -m "chore: update contribution heatmap"
          git push
